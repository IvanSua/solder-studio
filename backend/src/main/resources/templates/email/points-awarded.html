<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Variables:
    firstName      : String
    pointsAwarded  : int
    totalPoints    : int
    reason         : String  (ORDER_DELIVERED, REFERRAL, PROMO, etc.)
    loyaltyUrl     : String
    frontendUrl    : String
-->
<head>
  <meta charset="UTF-8">
  <title>¡Puntos ganados! – Solder Studio</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
             background:#f9fafb;padding:0;margin:0;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:#f9fafb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0" border="0"
               style="max-width:520px;width:100%;background:#ffffff;border-radius:12px;
                      border:1px solid #e5e7eb;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background:#111827;padding:24px 32px;">
              <span style="color:#ffffff;font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;">
                Solder Studio
              </span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">

              <p style="font-size:3rem;text-align:center;margin:0 0 12px;">🎉</p>

              <h2 style="margin:0 0 16px;color:#111827;text-align:center;font-size:1.2rem;font-weight:700;">
                ¡Ganaste puntos!
              </h2>

              <p style="color:#374151;margin:0 0 8px;">
                Hola <strong th:text="${firstName}">Usuario</strong>,
              </p>

              <!-- Points earned badge -->
              <div style="background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);
                          border-radius:12px;padding:20px;text-align:center;margin:0 0 16px;">
                <p style="margin:0;font-size:2.5rem;font-weight:800;color:#92400e;">
                  +<span th:text="${pointsAwarded}">150</span>
                </p>
                <p style="margin:4px 0 0;font-size:0.9rem;color:#b45309;">
                  puntos ganados
                </p>
              </div>

              <!-- Reason -->
              <div style="background:#f3f4f6;border-radius:8px;padding:14px 20px;margin:0 0 16px;">
                <p style="margin:0 0 4px;color:#6b7280;font-size:0.85rem;">Motivo</p>
                <p style="margin:0;color:#111827;font-weight:600;"
                   th:text="${@emailService.loyaltyReasonLabel(reason)}">
                  Pedido entregado
                </p>
              </div>

              <!-- Total points -->
              <div style="background:#f3f4f6;border-radius:8px;padding:14px 20px;margin:0 0 24px;">
                <p style="margin:0 0 4px;color:#6b7280;font-size:0.85rem;">Total acumulado</p>
                <p style="margin:0;color:#111827;font-weight:700;font-size:1.2rem;">
                  <span th:text="${totalPoints}">1,250</span> puntos
                </p>
              </div>

              <!-- CTA -->
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-radius:8px;background:#2563eb;">
                    <a th:href="${loyaltyUrl}"
                       href="#"
                       style="display:inline-block;background:#2563eb;color:#ffffff;
                              text-decoration:none;padding:11px 26px;border-radius:8px;
                              font-weight:600;font-size:0.9rem;">
                      Ver mi Programa de Puntos
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:14px 32px;
                       text-align:center;font-size:0.78rem;color:#9ca3af;">
              Solder Studio &middot; Buenos Aires, Argentina
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
