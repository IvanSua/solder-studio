<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Variables:
    firstName    : String
    itemCount    : int
    cartUrl      : String  (frontendUrl + /carrito)
    frontendUrl  : String
-->
<head>
  <meta charset="UTF-8">
  <title>Olvidaste algo en tu carrito – Solder Studio</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
             background:#f9fafb;padding:0;margin:0;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:#f9fafb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0" border="0"
               style="max-width:520px;width:100%;background:#ffffff;border-radius:12px;
                      border:1px solid #e5e7eb;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background:#111827;padding:24px 32px;">
              <span style="color:#ffffff;font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;">
                Solder Studio
              </span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">

              <p style="font-size:2.4rem;text-align:center;margin:0 0 8px;">🛒</p>

              <h2 style="margin:0 0 16px;color:#111827;text-align:center;font-size:1.15rem;font-weight:700;">
                ¡Dejaste
                <span th:text="${itemCount}">0</span>
                <span th:text="${itemCount == 1 ? 'producto' : 'productos'}">productos</span>
                en el carrito!
              </h2>

              <p style="color:#374151;margin:0 0 8px;">
                Hola <strong th:text="${firstName}">Usuario</strong>,
              </p>
              <p style="color:#374151;line-height:1.7;margin:0 0 24px;">
                Notamos que tenés artículos guardados en tu carrito.
                ¡Completá tu compra antes de que se agote el stock!
              </p>

              <!-- CTA -->
              <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                <tr>
                  <td style="border-radius:8px;background:#2563eb;">
                    <a th:href="${cartUrl}"
                       href="#"
                       style="display:inline-block;background:#2563eb;color:#ffffff;
                              text-decoration:none;padding:12px 28px;border-radius:8px;
                              font-weight:600;font-size:0.9375rem;">
                      Finalizar compra
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:14px 32px;
                       text-align:center;font-size:0.78rem;color:#9ca3af;">
              Solder Studio &middot; Buenos Aires, Argentina &middot;
              <a th:href="${frontendUrl + '/unsubscribe'}"
                 href="#"
                 style="color:#9ca3af;text-decoration:none;">
                Cancelar suscripción
              </a>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
