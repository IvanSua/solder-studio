<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Variables:
    firstName      : String
    returnId       : Long
    orderId        : Long
    status         : String  (APPROVED, IN_PROGRESS, COMPLETED, REJECTED, PENDING)
    statusMessage  : String  (human-readable message)
    resolution     : String  (REFUND or EXCHANGE)
    ordersUrl      : String
    frontendUrl    : String
-->
<head>
  <meta charset="UTF-8">
  <title>Actualización de tu devolución – Solder Studio</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
             background:#f9fafb;padding:0;margin:0;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:#f9fafb;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0" border="0"
               style="max-width:520px;width:100%;background:#ffffff;border-radius:12px;
                      border:1px solid #e5e7eb;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background:#111827;padding:24px 32px;">
              <span style="color:#ffffff;font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;">
                Solder Studio
              </span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">

              <!-- Status icon -->
              <p style="font-size:2.4rem;text-align:center;margin:0 0 12px;"
                 th:text="${@emailService.statusIconForReturn != null 
                           ? @emailService.statusIconForReturn : '📦'}">📦</p>

              <h2 style="margin:0 0 16px;color:#111827;text-align:center;font-size:1.2rem;font-weight:700;">
                Actualización de tu devolución
              </h2>

              <p style="color:#374151;margin:0 0 8px;">
                Hola <strong th:text="${firstName}">Usuario</strong>,
              </p>

              <!-- Return info box -->
              <div style="background:#f3f4f6;border-radius:8px;padding:14px 20px;margin:0 0 16px;">
                <p style="margin:0 0 4px;color:#374151;font-size:0.9rem;">
                  Devolución <strong th:text="'#' + ${returnId}">#1</strong>
                  &nbsp;·&nbsp;
                  Pedido <strong th:text="'#' + ${orderId}">#123</strong>
                </p>
                <p style="margin:0;color:#374151;font-size:0.9rem;">
                  Resolución: <strong th:text="${resolution}">Reembolso</strong>
                </p>
              </div>

              <!-- Status message -->
              <p style="color:#374151;margin:0 0 24px;line-height:1.6;"
                 th:text="${statusMessage}">
                Tu solicitud de devolución fue aprobada.
              </p>

              <!-- CTA -->
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-radius:8px;background:#2563eb;">
                    <a th:href="${ordersUrl}"
                       href="#"
                       style="display:inline-block;background:#2563eb;color:#ffffff;
                              text-decoration:none;padding:11px 26px;border-radius:8px;
                              font-weight:600;font-size:0.9rem;">
                      Ver mis pedidos
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb;border-top:1px solid #e5e7eb;padding:14px 32px;
                       text-align:center;font-size:0.78rem;color:#9ca3af;">
              Solder Studio &middot; Buenos Aires, Argentina
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
