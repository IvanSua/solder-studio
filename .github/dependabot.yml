version: 2
updates:
  # Backend — Maven (Spring Boot, MercadoPago SDK, iText, etc.)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework*"
    labels:
      - "dependencies"
      - "backend"

  # Frontend — npm (Angular, fabric.js, etc.)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
    labels:
      - "dependencies"
      - "frontend"

  # Workspace root — npm (Playwright, tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions — el propio pipeline de CI/CD
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
