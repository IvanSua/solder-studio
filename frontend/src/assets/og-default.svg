<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111827"/>
  
  <!-- Decorative grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo shape (tshirt) -->
  <g transform="translate(500, 160)">
    <!-- T-shirt body -->
    <path d="M50 0 L90 0 L90 40 L120 40 L120 60 L180 60 L180 200 L50 200 L50 60 L20 60 L20 40 L50 40 Z" 
          fill="url(#accent)" opacity="0.9"/>
    <!-- Collar -->
    <ellipse cx="90" cy="0" rx="40" ry="15" fill="#111827"/>
    <!-- Sleeve lines -->
    <line x1="120" y1="40" x2="120" y2="60" stroke="#111827" stroke-width="3"/>
    <line x1="180" y1="40" x2="180" y2="60" stroke="#111827" stroke-width="3"/>
  </g>
  
  <!-- Brand name -->
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="64" font-weight="bold" 
        fill="#ffffff" text-anchor="middle">SOLDER STUDIO</text>
  
  <!-- Tagline -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" 
        fill="#9ca3af" text-anchor="middle">Ropa personalizada en Argentina</text>
  
  <!-- Corner accent -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>
  <rect x="1192" y="0" width="8" height="630" fill="url(#accent)"/>
</svg>
