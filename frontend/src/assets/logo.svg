<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- Background -->
  <rect width="400" height="200" fill="#111827" rx="12"/>
  
  <!-- Logo shape (tshirt simplified) -->
  <g transform="translate(130, 40)">
    <defs>
      <linearGradient id="accentL" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6366f1"/>
        <stop offset="100%" stop-color="#8b5cf6"/>
      </linearGradient>
    </defs>
    <!-- T-shirt body -->
    <path d="M20 0 L50 0 L50 20 L70 20 L70 35 L110 35 L110 110 L20 110 L20 35 L0 35 L0 20 L20 20 Z" 
          fill="url(#accentL)" opacity="0.95"/>
    <!-- Collar -->
    <ellipse cx="50" cy="0" rx="30" ry="10" fill="#111827"/>
    <!-- Sleeve lines -->
    <line x1="70" y1="20" x2="70" y2="35" stroke="#111827" stroke-width="2"/>
    <line x1="110" y1="20" x2="110" y2="35" stroke="#111827" stroke-width="2"/>
  </g>
  
  <!-- Brand name -->
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="#ffffff" text-anchor="middle">SOLDER STUDIO</text>
  
  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="200" fill="#6366f1" rx="3"/>
</svg>
