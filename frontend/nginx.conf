server {
    # PORT is injected by Railway (and most PaaS) — the container must listen on
    # whatever port the platform assigns, not a hardcoded one, or it's unreachable.
    # Substituted by envsubst at container start (see Dockerfile CMD); defaults to
    # 80 for local/docker-compose use where PORT isn't set.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy — BACKEND_URL is injected at container start via envsubst.
    # In local docker-compose it points to http://backend:8080.
    # In Render (or any cloud) it points to the backend's public HTTPS URL.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # OAuth2 callbacks — handled entirely by the backend
    location /login/oauth2/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets aggressively (they're content-hashed by Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Generate a request ID if the client doesn't send one, and propagate it
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # index.html — no cache (always revalidate for SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Request-ID $req_id always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP
    # script-src  — 'unsafe-inline' required by Google Analytics (inline gtag config injected
    #               dynamically by AnalyticsService); GTM domain for the external gtag script.
    # connect-src — Sentry error reporting, Google Analytics beacons, MercadoPago SDK calls.
    #               /api/ requests always go to 'self' via the nginx proxy above.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.mercadopago.com https://sdk.mercadopago.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.ingest.sentry.io; frame-src https://www.mercadopago.com https://mercadopago.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # HSTS — fuerza HTTPS por 2 años. No activar preload sin registrar el dominio en hstspreload.org.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Permissions-Policy — restringe acceso a APIs sensibles del browser.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
}
